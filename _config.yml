# GitHub Pages bygger sajten med Jekyll. Allt som star i exclude kopieras
# inte till den publicerade sajten och gar darfor inte att hamta utifran.
#
# Bakgrund: worker/system-prompt.js ar assistentens hela regelverk med
# prislogik och saljinstruktioner, och lag oppet nedladdningsbar.
# CLAUDE.md, PUBLICERA.md och README.md ar interna arbetsdokument.
#
# verktyg/ star medvetet INTE i listan - den mappen ska fortsatta
# publiceras. Filer och mappar som borjar med _ hoppas over av Jekyll
# automatiskt, sa _att-radera/ behover ingen egen rad.
exclude:
  - worker/
  - CLAUDE.md
  - PUBLICERA.md
  - README.md
  - skript/
  # Fem bildfiler som ingen sida refererar: fyra JPEG fran ett tidigt
  # utkast och kallfilen till app-ikonen. Tillsammans drygt 5 MB som
  # annars publiceras utan att nagon kan na dem via sajten. De ligger
  # kvar i repot, de ska bara inte ut pa webben.
  - assets/1.jpeg
  - assets/2.jpeg
  - assets/3.jpeg
  - assets/4.jpeg
  - assets/app-ikon-kalla.png
